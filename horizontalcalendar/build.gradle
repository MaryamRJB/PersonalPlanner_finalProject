plugins {
    id 'com.android.library'
}

android {
    namespace 'com.example.horizontalcalendar' // نام پکیج دلخواه خود را جایگزین کنید
    compileSdk 34 // یا نسخه‌ی SDK مورد نظر خود را وارد کنید

    defaultConfig {
        minSdk 24
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    compileSdkExtension 12
    buildToolsVersion '34.0.0'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.apachat:primecalendar-android:1.3.93'
}